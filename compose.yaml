services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      API_V1_PREFIX: api/v1
      SUPABASE_URL: "${SUPABASE_DOCKER_URL:-${SUPABASE_URL}}"
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
